            --text-color: #0f172a;

            --heading-color: #1e3a8a;
            --border-color: #cbd5e1;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Gujarati', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .quiz-wrapper {

            max-width: 950px;
            background: var(--container-bg);

            border: 2px solid var(--border-color);

            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .quiz-header {

            display: flex;

            color: #1e293b;

            flex-direction: column;
            gap: 8px;

            align-items: center;
            gap: 10px;

            background: #eff6ff;
        }

            height: 17px;
            cursor: pointer;
        }

            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            line-height: 1.5;

            margin-top: 10px;
            padding-top: 15px;

</head>

    </form>
</div>

<!-- પરિણામ મોડલ -->
<div id="resultModal">

// ગુગલ એપ્સ સ્ક્રિપ્ટ એન્ડપોઇન્ટ
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-khogtnFjvjzRuv_ieBYJfx0TAxluM9OfoXlf72h9Yce14rdQu9_Xbmx3fnprk5Q30g/exec";

var currentStudentEmail = "";
var currentStudentName = "";

function initQuiz() {
    var urlParams = new URLSearchParams(window.location.search);
    currentStudentEmail = urlParams.get('email') || localStorage.getItem("portal_user_email") || "student@example.com";
    currentStudentName = urlParams.get('name') || localStorage.getItem("portal_user_name") || "વિદ્યાર્થી";

    document.getElementById("studentName").innerText = currentStudentName;
    document.getElementById("studentEmail").innerText = currentStudentEmail;

    var container = document.getElementById("questionsContainer");
    container.innerHTML = "";

    questions.forEach(function(q, qIndex) {
        var card = document.createElement("div");
        card.className = "q-card";
        card.id = "qCard_" + qIndex;

        var optHtml = "";
        q.options.forEach(function(opt, oIndex) {
            optHtml += '<label class="opt-label" id="optLabel_' + qIndex + '_' + oIndex + '">' +
                '<input type="radio" name="q' + qIndex + '" value="' + oIndex + '"> ' +
                '<span><strong>(' + String.fromCharCode(65 + oIndex) + ')</strong> ' + opt + '</span>' +
                '</label>';
        });

        card.innerHTML = '<div class="q-title">પ્રશ્ન ' + (qIndex + 1) + '. ' + q.question + '</div>' +
            '<div class="options-grid">' + optHtml + '</div>' +
            '<div class="explanation-box" id="expBox_' + qIndex + '">' +
            '<div><strong>સાચો ઉત્તર: (' + String.fromCharCode(65 + q.answer) + ')</strong> ' + q.options[q.answer] + '</div>' +
            '<div style="margin-top:4px;">💡 <strong>સમજૂતી:</strong> ' + q.explanation + '</div>' +
            '</div>';

        container.appendChild(card);
    });
}

function submitTest() {
    var totalQuestions = questions.length;
    var correctCount = 0;
    var attemptedCount = 0;

    questions.forEach(function(q, qIndex) {
        var radios = document.getElementsByName('q' + qIndex);
        var selected = -1;
        for (var i = 0; i < radios.length; i++) {
            if (radios[i].checked) {
                selected = parseInt(radios[i].value, 10);
                break;
            }
        }

        var expBox = document.getElementById("expBox_" + qIndex);
        expBox.style.display = "block";

        if (selected !== -1) {
            attemptedCount++;
            if (selected === q.answer) {
                correctCount++;
                expBox.className = "explanation-box correct";
                document.getElementById('optLabel_' + qIndex + '_' + selected).style.borderColor = "#10b981";
                document.getElementById('optLabel_' + qIndex + '_' + selected).style.background = "#ecfdf5";
            } else {
                expBox.className = "explanation-box wrong";
                document.getElementById('optLabel_' + qIndex + '_' + selected).style.borderColor = "#ef4444";
                document.getElementById('optLabel_' + qIndex + '_' + selected).style.background = "#fef2f2";
                document.getElementById('optLabel_' + qIndex + '_' + q.answer).style.borderColor = "#10b981";
                document.getElementById('optLabel_' + qIndex + '_' + q.answer).style.background = "#ecfdf5";
            }
        } else {
            expBox.className = "explanation-box wrong";
            document.getElementById('optLabel_' + qIndex + '_' + q.answer).style.borderColor = "#10b981";
            document.getElementById('optLabel_' + qIndex + '_' + q.answer).style.background = "#ecfdf5";
        }
    });

    var percentage = ((correctCount / totalQuestions) * 100).toFixed(2);
    document.getElementById("modalScoreText").innerHTML = "મેળવેલ ગુણ: <strong>" + correctCount + " / " + totalQuestions + "</strong><br>ટકાવારી: <strong>" + percentage + "%</strong>";
    document.getElementById("resultModal").style.display = "flex";
    document.getElementById("submitBtn").disabled = true;

    // પોર્ટલ શીટમાં સ્કોર લોગ કરવો
    var pathParts = window.location.pathname.split('/');
    var fileName = pathParts.pop() || "1bnew100question.html";
    var repoName = pathParts.pop() || "fy";

    var payload = {
        action: "saveTestResult",
        email: currentStudentEmail,
        name: currentStudentName,
        subject: "કોર્સ ૧(બ) ૧૦૦ HOT પ્રશ્નો",
        score: correctCount + "/" + totalQuestions,
        percentage: percentage,
        repoName: repoName,
        testFileName: fileName
    };

    fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
    })
    .then(function() {
        document.getElementById("modalSyncStatus").innerText = "✅ પરિણામ સફળતાપૂર્વક પોર્ટલ પર નોંધાઈ ગયું છે.";
    })
    .catch(function() {
        document.getElementById("modalSyncStatus").innerText = "⚠️ સ્થાનિક સ્કોરિંગ પૂર્ણ થયું છે (ઓનલાઈન સિંકમાં ક્ષતિ).";
    });
}

function closeResultModal() {
    document.getElementById("resultModal").style.display = "none";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('DOMContentLoaded', initQuiz);
</script>
